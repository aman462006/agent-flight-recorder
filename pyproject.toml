[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afrec"
version = "0.2.0"
description = "Agent Flight Recorder — record, replay and debug AI agent executions: full traces, cost/latency profiling, deterministic replay and divergence-based failure investigation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aman Dihora" }]
dependencies = [
    # Only HttpStore needs it; the local SQLite store path is stdlib-only.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[tool.setuptools]
packages = ["afrec"]
