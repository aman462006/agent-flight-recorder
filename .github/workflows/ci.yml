name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # pytest runs the full backend suite INCLUDING the benchmark
      # threshold pins (tests/test_benchmark.py) and the held-out
      # adversarial outcome pins (tests/test_heldout.py), so a rule
      # regression or a benchmark drift fails CI here, not in a demo.
      - name: Test (pytest, incl. benchmark + held-out pins)
        run: python -m pytest tests/ -q

      # The benchmark runs again standalone so the JSON report in
      # bench/results/ regenerating cleanly is itself verified.
      - name: Benchmark runs clean
        run: python -m bench.run_benchmark

      - name: Held-out adversarial set runs clean
        run: python -m bench.run_heldout

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
